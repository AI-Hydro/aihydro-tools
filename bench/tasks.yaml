# aihydro-bench task specs — v1 (2026-05-08, Sprint 2 adds B-021 to B-023)
#
# 23 frozen, human-adjudicated benchmark tasks.
# Tasks are split into two pytest marks:
#   bench       — no network required; runs on every push (CI-safe)
#   bench_live  — requires USGS / GridMET APIs; runs nightly
#
# Each task specifies:
#   id, name, tier, mark, category, call_style, assertions
#
# call_style:
#   mcp_tool   — call the named MCP tool function directly with kwargs
#   compute_fn — call an underlying computation function with synthetic data
#   session_op — set up a session slot, then call an MCP tool
#
# Adjudicated ranges are sourced from:
#   - Addor et al. (2017) CAMELS dataset, HESS 21:5293-5313
#   - Sawicz et al. (2011) Catchment classification, WRR 47:W11520
#   - USGS StreamStats published basin attributes

tasks:

  # ─────────────────────────────────────────────────────────────────────────
  # GROUP A: Water balance validator (session-based, no network)
  # ─────────────────────────────────────────────────────────────────────────

  - id: B-001
    name: "Water balance: humid basin passes"
    tier: 1
    mark: bench
    category: validator
    call_style: session_op
    rationale: >
      Eastern-US humid basin with runoff_ratio=0.42 is physically valid.
      Mean annual P≈1000 mm, Q≈420 mm is typical for humid temperate climate
      (CAMELS northeastern basins median RR ≈ 0.44, Addor 2017 Table 2).
    setup:
      session_id: bench-wb-001
      slots:
        signatures:
          data:
            runoff_ratio: 0.42
    call:
      tool: check_water_balance_consistency
      kwargs:
        session_id: bench-wb-001
    assertions:
      - {path: status, op: eq, expected: pass}
      - {path: error, op: absent}

  - id: B-002
    name: "Water balance: slightly over 1.0 triggers medium warning"
    tier: 1
    mark: bench
    category: validator
    call_style: session_op
    rationale: >
      runoff_ratio=1.05 is marginally above 1.0. Possible in snow-dominated
      basins with glacier contribution or NWIS rating-curve errors at high
      flows. Severity=medium is correct — flag but not high-confidence error.
    setup:
      session_id: bench-wb-002
      slots:
        signatures:
          data:
            runoff_ratio: 1.05
    call:
      tool: check_water_balance_consistency
      kwargs:
        session_id: bench-wb-002
    assertions:
      - {path: status, op: eq, expected: warning}
      - {path: severity, op: eq, expected: medium}
      - {path: error, op: absent}

  - id: B-003
    name: "Water balance: strongly impossible triggers high warning"
    tier: 1
    mark: bench
    category: validator
    call_style: session_op
    rationale: >
      runoff_ratio=1.45 cannot be explained by any physical process without
      large inter-basin transfer or major gauging error. Severity=high.
    setup:
      session_id: bench-wb-003
      slots:
        signatures:
          data:
            runoff_ratio: 1.45
    call:
      tool: check_water_balance_consistency
      kwargs:
        session_id: bench-wb-003
    assertions:
      - {path: status, op: eq, expected: warning}
      - {path: severity, op: eq, expected: high}

  - id: B-004
    name: "Water balance: missing signatures returns insufficient_data"
    tier: 1
    mark: bench
    category: validator
    call_style: session_op
    rationale: >
      Calling the validator before extract_hydrological_signatures must
      return insufficient_data, not an exception. Resilience check.
    setup:
      session_id: bench-wb-004
      slots: {}
    call:
      tool: check_water_balance_consistency
      kwargs:
        session_id: bench-wb-004
    assertions:
      - {path: status, op: eq, expected: insufficient_data}
      - {path: error, op: absent}

  # ─────────────────────────────────────────────────────────────────────────
  # GROUP B: Temporal alignment validator (session-based, no network)
  # ─────────────────────────────────────────────────────────────────────────

  - id: B-005
    name: "Temporal alignment: matching periods pass"
    tier: 1
    mark: bench
    category: validator
    call_style: session_op
    rationale: >
      Streamflow and forcing both spanning 2000-01-01 to 2009-12-31 are
      temporally consistent. Tool must return status=pass.
    setup:
      session_id: bench-ta-005
      slots:
        streamflow:
          meta:
            params:
              start_date: "2000-01-01"
              end_date: "2009-12-31"
        forcing:
          meta:
            params:
              start_date: "2000-01-01"
              end_date: "2009-12-31"
    call:
      tool: check_temporal_alignment
      kwargs:
        session_id: bench-ta-005
        slot_a: streamflow
        slot_b: forcing
    assertions:
      - {path: status, op: eq, expected: pass}

  - id: B-006
    name: "Temporal alignment: mismatched periods fail with dates in message"
    tier: 1
    mark: bench
    category: validator
    call_style: session_op
    rationale: >
      Forcing starting 2 years after streamflow is a common data-prep error.
      The fail message must include both date ranges so the researcher can
      diagnose the gap without reading raw metadata.
    setup:
      session_id: bench-ta-006
      slots:
        streamflow:
          meta:
            params:
              start_date: "2000-01-01"
              end_date: "2009-12-31"
        forcing:
          meta:
            params:
              start_date: "2002-01-01"
              end_date: "2009-12-31"
    call:
      tool: check_temporal_alignment
      kwargs:
        session_id: bench-ta-006
        slot_a: streamflow
        slot_b: forcing
    assertions:
      - {path: status, op: eq, expected: fail}
      - {path: severity, op: eq, expected: medium}
      - {path: message, op: contains, expected: "2000-01-01"}
      - {path: message, op: contains, expected: "2002-01-01"}

  # ─────────────────────────────────────────────────────────────────────────
  # GROUP C: Unit consistency validator (session-based, no network)
  # ─────────────────────────────────────────────────────────────────────────

  - id: B-007
    name: "Unit consistency: correct m3/s passes"
    tier: 1
    mark: bench
    category: validator
    call_style: session_op
    rationale: >
      Streamflow stored in m3/s and expected in m3/s — no mismatch.
      Pass is the only correct scientific answer.
    setup:
      session_id: bench-uc-007
      slots:
        streamflow:
          data:
            units: "m3/s"
    call:
      tool: check_unit_consistency
      kwargs:
        session_id: bench-uc-007
        slot: streamflow
        expected_units: "m3/s"
    assertions:
      - {path: status, op: eq, expected: pass}

  - id: B-008
    name: "Unit consistency: cfs vs m3/s mismatch triggers high-severity fail"
    tier: 1
    mark: bench
    category: validator
    call_style: session_op
    rationale: >
      cfs to m3/s error (factor ≈ 28.3) would corrupt all volumetric outputs
      downstream. High severity is the only defensible assignment — any model
      trained on wrong-unit Q would produce scientifically invalid results.
    setup:
      session_id: bench-uc-008
      slots:
        streamflow:
          data:
            units: "cfs"
    call:
      tool: check_unit_consistency
      kwargs:
        session_id: bench-uc-008
        slot: streamflow
        expected_units: "m3/s"
    assertions:
      - {path: status, op: eq, expected: fail}
      - {path: severity, op: eq, expected: high}

  # ─────────────────────────────────────────────────────────────────────────
  # GROUP D: Scientific computation (compute_* functions, synthetic pd.Series)
  # ─────────────────────────────────────────────────────────────────────────

  - id: B-009
    name: "Flow stats: humid synthetic series has plausible q_mean and BFI"
    tier: 1
    mark: bench
    category: signatures
    call_style: compute_fn
    rationale: >
      Humid temperate basin (synthetic, seed=42) with mean=1.2 mm/day should
      produce q_mean ∈ [0.8, 1.8] mm/day. BFI ∈ [0.20, 0.40] is the
      re-adjudicated range for the corrected Lyne-Hollick recursive filter
      (Nathan & McMahon 1990, alpha=0.925, 3-pass), which gives systematically
      lower BFI than the Eckhardt filter used in CAMELS (~0.50-0.70 for the
      same basin type). The old bounds [0.40, 0.75] were calibrated against a
      buggy filter version that returned the quickflow fraction rather than the
      baseflow fraction. Re-adjudicated 2026-06-13 after confirming the
      corrected filter yields BFI ≈ 0.29 for this synthetic series.
    call:
      fn: compute_flow_stats_camels
      data: humid
    assertions:
      - {path: q_mean, op: between, bounds: [0.8, 1.8]}
      - {path: baseflow_index, op: between, bounds: [0.20, 0.40]}
      - {path: q5, op: gt, expected: 0.0}
      - {path: q95, op: gt, expected: 0.0}
      - {path: q_std, op: gt, expected: 0.0}

  - id: B-010
    name: "Flow stats: arid synthetic series has low q_mean"
    tier: 1
    mark: bench
    category: signatures
    call_style: compute_fn
    rationale: >
      Arid basin (synthetic, seed=7, mean=0.15 mm/day, ~40% zero-flow days)
      must produce q_mean < 0.25 mm/day. BFI is NOT asserted here: the
      Lyne-Hollick filter (alpha=0.925, 3 passes) artificially maintains
      baseflow through zero-flow days, producing inflated BFI for intermittent
      streams — a known filter artifact (Ladson et al. 2013 §4.2 caution).
      BFI plausibility for intermittent streams requires a different index
      (e.g. Eckhardt, 2008) — tracked as a Sprint 2 improvement item.
    call:
      fn: compute_flow_stats_camels
      data: arid
    assertions:
      - {path: q_mean, op: between, bounds: [0.05, 0.25]}
      - {path: baseflow_index, op: present}

  - id: B-011
    name: "Water balance: known runoff_ratio recovered within 5% from synthetic data"
    tier: 1
    mark: bench
    category: signatures
    call_style: compute_fn
    rationale: >
      Synthetic P and Q constructed with runoff_ratio=0.42 target. The
      compute_water_balance_camels function should recover a value within ±5%
      of 0.42 (i.e. [0.40, 0.44]) — this tolerance accounts for daily
      misalignment and the exponential P distribution used in synthetic.py.
      A larger error indicates a bug in the annual aggregation or alignment.
    call:
      fn: compute_water_balance_camels
      data: humid
      p_runoff_ratio: 0.42
    assertions:
      - {path: runoff_ratio, op: approx_pct, expected: 0.42, pct: 0.10}
      - {path: stream_elas, op: present}

  - id: B-012
    name: "Event stats: humid series has non-zero high-flow frequency and duration"
    tier: 1
    mark: bench
    category: signatures
    call_style: compute_fn
    rationale: >
      Any 10-year humid series must contain at least some high-flow events
      (> 9× median Q per CAMELS definition). high_q_freq > 0 and
      high_q_dur > 0 are necessary conditions. A value of zero would mean
      the threshold is miscalibrated or the series is entirely flat.
    call:
      fn: compute_event_stats_camels
      data: humid
    assertions:
      - {path: high_q_freq, op: gt, expected: 0.0}
      - {path: high_q_dur, op: gt, expected: 0.0}
      - {path: low_q_freq, op: gt, expected: 0.0}

  - id: B-013
    name: "FDC slope: humid series produces positive slope in CAMELS range"
    tier: 1
    mark: bench
    category: signatures
    call_style: compute_fn
    rationale: >
      Sawicz et al. (2011) define slope_fdc = (log Q33 - log Q66) / 0.33
      where Q33 is flow at 33% exceedance probability (high flow, 67th pct)
      and Q66 is flow at 66% exceedance probability (lower flow, 34th pct).
      Since Q33 > Q66, the slope is positive. CAMELS humid basin range is
      roughly [0.5, 3.5] (Addor 2017 Table S1). A value < 0 would indicate
      a quantile-ordering bug; > 6 would indicate extreme flashiness
      inconsistent with a humid temperate synthetic series.
    call:
      fn: compute_slope_fdc_camels
      data: humid
    assertions:
      - {path: slope_fdc, op: between, bounds: [0.3, 6.0]}

  # ─────────────────────────────────────────────────────────────────────────
  # GROUP E: Claim ledger gate (session-based, no network)
  # ─────────────────────────────────────────────────────────────────────────

  - id: B-014
    name: "Promotion gate: no researcher approval is blocked"
    tier: 1
    mark: bench
    category: ledger
    call_style: session_op
    rationale: >
      Researcher approval is a hard gate — no exceptions. The gate prevents
      the agent from autonomously promoting claims to global knowledge without
      a human sign-off. Any path that bypasses this check would undermine
      the scientific integrity contract.
    setup:
      session_id: bench-lg-014
      claims:
        c-014:
          id: c-014
          claim: "KGE > 0.8 for Piscataquis River 2000-2010"
          claim_type: empirical_result
          status: supported
          confidence: high
          confidence_rationale: "Validated with 10 years of daily data, KGE=0.83 across 3 restarts."
          scope: {basins: ["01031500"], period: "2000-2010"}
          evidence_spans:
            - {source_type: run, source_id: run-abc, metric_ref: kge}
          limitations: ["Single basin, humid temperate only"]
    call:
      tool: promote_claim_to_registry
      kwargs:
        session_id: bench-lg-014
        claim_id: c-014
        researcher_approved: false
    assertions:
      - {path: error, op: present}
      - {path: message, op: contains, expected: "approval"}

  - id: B-015
    name: "Promotion gate: approved but missing evidence_spans is blocked"
    tier: 1
    mark: bench
    category: ledger
    call_style: session_op
    rationale: >
      A claim without evidence_spans cannot be traced to any run, paper, or
      dataset. Promoting it would add an unverifiable fact to global knowledge.
      The gate must block this regardless of researcher_approved=True.
    setup:
      session_id: bench-lg-015
      claims:
        c-015:
          id: c-015
          claim: "NSE > 0.7 for test basin"
          claim_type: empirical_result
          status: supported
          confidence: medium
          confidence_rationale: "Model ran successfully for 5 years of daily calibration data."
          scope: {basins: ["02361000"], period: "2005-2010"}
          evidence_spans: []
          limitations: ["Single basin"]
    call:
      tool: promote_claim_to_registry
      kwargs:
        session_id: bench-lg-015
        claim_id: c-015
        researcher_approved: true
    assertions:
      - {path: error, op: present}
      - {path: message, op: contains, expected: "evidence"}

  - id: B-016
    name: "Promotion gate: fully valid claim is promoted"
    tier: 1
    mark: bench
    category: ledger
    call_style: session_op
    rationale: >
      A claim with all required fields (evidence_spans, limitations, supported
      status, researcher_approved) must pass all gate checks and return
      status=promoted. This is the golden path test.
    setup:
      session_id: bench-lg-016
      claims:
        c-016:
          id: c-016
          claim: "HBV-light achieves KGE=0.75 for Piscataquis River 2000-2010"
          claim_type: empirical_result
          status: supported
          confidence: high
          confidence_rationale: >
            Validated across 3 random restarts with 10 years of daily
            USGS NWIS streamflow data. KGE=0.75 consistent across restarts.
          scope: {basins: ["01031500"], period: "2000-2010"}
          evidence_spans:
            - {source_type: run, source_id: hbv-run-01031500-v1, metric_ref: kge}
            - {source_type: dataset, source_id: usgs_nwis_01031500, metric_ref: null}
          limitations:
            - "Calibrated on humid temperate basin only — not validated for semi-arid"
            - "HBV-light does not simulate glacier dynamics"
    call:
      tool: promote_claim_to_registry
      kwargs:
        session_id: bench-lg-016
        claim_id: c-016
        researcher_approved: true
    assertions:
      - {path: status, op: eq, expected: promoted}
      - {path: error, op: absent}

  # ─────────────────────────────────────────────────────────────────────────
  # GROUP F: Knowledge registry (pure Python, no network)
  # ─────────────────────────────────────────────────────────────────────────

  - id: B-017
    name: "Knowledge registry: KGE metric has Gupta 2009 citation"
    tier: 3
    mark: bench
    category: knowledge
    call_style: mcp_tool
    rationale: >
      The Kling-Gupta Efficiency must cite Gupta et al. (2009) — this is the
      original paper that defined KGE. If the citation is missing, any
      researcher relying on the registry for bibliography generation will
      produce an incomplete reference list.
    call:
      tool: get_metric_definition
      kwargs:
        metric_id: metric.kge
    assertions:
      - {path: name, op: eq, expected: "Kling-Gupta Efficiency"}
      - {path: citations, op: contains, expected: gupta_2009}
      - {path: error, op: absent}

  - id: B-018
    name: "Knowledge registry: streamflow variable has correct SI units"
    tier: 3
    mark: bench
    category: knowledge
    call_style: mcp_tool
    rationale: >
      Standard SI unit for volumetric flow rate is m3/s (cubic metres per
      second). Any tool that outputs streamflow in different units must
      declare a unit mismatch. If the registry declares wrong units, the
      unit_consistency validator will pass incorrect data.
    call:
      tool: get_variable_definition
      kwargs:
        variable_id: variable.streamflow
    assertions:
      - {path: standard_units, op: eq, expected: "m3/s"}
      - {path: error, op: absent}

  - id: B-019
    name: "Knowledge registry: USGS NWIS dataset links to correct access tool"
    tier: 3
    mark: bench
    category: knowledge
    call_style: mcp_tool
    rationale: >
      Agents discover which tool to call for a dataset via access_tool in
      the registry. If this points to the wrong function name, the agent
      will attempt to use a non-existent tool and fail silently.
    call:
      tool: get_dataset_info
      kwargs:
        dataset_id: dataset.usgs_nwis
    assertions:
      - {path: access_tool, op: eq, expected: fetch_streamflow_data}
      - {path: error, op: absent}

  # ─────────────────────────────────────────────────────────────────────────
  # GROUP G: Live integration (require network — @pytest.mark.bench_live)
  # ─────────────────────────────────────────────────────────────────────────

  # ─────────────────────────────────────────────────────────────────────────
  # GROUP H: Tier 1 enforcement (post_run injection, no network)
  # ─────────────────────────────────────────────────────────────────────────

  - id: B-021
    name: "Enforcement: quality_flags injected when runoff_ratio is valid"
    tier: 1
    mark: bench
    category: enforcement
    call_style: enforcement_fn
    rationale: >
      After extract_hydrological_signatures completes with a valid session
      (runoff_ratio=0.42), post_run() must inject quality_flags containing
      the water balance result. status=pass is the correct scientific answer
      for a humid basin. An absent quality_flags key means enforcement did
      not fire — a regression in the Tier 1 contract.
    setup:
      session_id: bench-enf-021
      slots:
        signatures:
          data:
            runoff_ratio: 0.42
    call:
      tool_name: extract_hydrological_signatures
      seed_result:
        data:
          runoff_ratio: 0.42
          q_mean: 1.2
    assertions:
      - {path: quality_flags, op: present}
      - {path: quality_flags, op: ne, expected: []}
      - {path: "quality_flags.0.status", op: eq, expected: pass}
      - {path: "quality_flags.0.validator", op: eq, expected: water_balance_consistency}

  - id: B-022
    name: "Enforcement: quality_flags captures water balance warning"
    tier: 1
    mark: bench
    category: enforcement
    call_style: enforcement_fn
    rationale: >
      When runoff_ratio=1.45 (physically impossible, severity=high), the
      auto-fired water balance validator must appear in quality_flags with
      status=warning and severity=high. The researcher sees the quality issue
      embedded in the tool result — no separate validator call needed.
    setup:
      session_id: bench-enf-022
      slots:
        signatures:
          data:
            runoff_ratio: 1.45
    call:
      tool_name: extract_hydrological_signatures
      seed_result:
        data:
          runoff_ratio: 1.45
    assertions:
      - {path: "quality_flags.0.status", op: eq, expected: warning}
      - {path: "quality_flags.0.severity", op: eq, expected: high}

  - id: B-023
    name: "Enforcement: unit mismatch captured in quality_flags for streamflow"
    tier: 1
    mark: bench
    category: enforcement
    call_style: enforcement_fn
    rationale: >
      After fetch_streamflow_data stores streamflow with units="cfs", the
      auto-fired unit consistency validator must flag a high-severity unit
      mismatch in quality_flags. This ensures the cfs→m3/s error (factor 28.3)
      is visible in the tool result itself, not only if the researcher
      explicitly calls check_unit_consistency.
    setup:
      session_id: bench-enf-023
      slots:
        streamflow:
          data:
            units: "cfs"
    call:
      tool_name: fetch_streamflow_data
      seed_result:
        data:
          units: "cfs"
    assertions:
      - {path: quality_flags, op: present}
      - {path: "quality_flags.0.status", op: eq, expected: fail}
      - {path: "quality_flags.0.severity", op: eq, expected: high}

  # ─────────────────────────────────────────────────────────────────────────
  # GROUP I: aihydro.verified namespace (Sprint 3)
  # ─────────────────────────────────────────────────────────────────────────

  - id: B-024
    name: "Verified: metric.kge carries verified=true from built-in registry"
    tier: 3
    mark: bench
    category: knowledge
    call_style: mcp_tool
    rationale: >
      The KGE metric (Gupta et al. 2009) is the foundational model evaluation
      metric in CAMELS-based hydrology. Its definition — formula, decomposition
      into r/alpha/beta, and the -0.41 benchmark threshold — is unambiguous in
      the literature. verified=True means workspace overrides require a
      peer-reviewed justification (scientific_justification field).
      If this assertion fails, the verified flag was dropped, weakening the
      override protection contract.
    call:
      tool: get_metric_definition
      kwargs:
        metric_id: metric.kge
    assertions:
      - {path: verified, op: eq, expected: true}
      - {path: name, op: eq, expected: "Kling-Gupta Efficiency"}

  # ─────────────────────────────────────────────────────────────────────────
  # GROUP J: Claim coupling (Sprint 4)
  # ─────────────────────────────────────────────────────────────────────────

  - id: B-025
    name: "Claim coupling: post_run injects _run_id into Tier 1 result"
    tier: 1
    mark: bench
    category: enforcement
    call_style: enforcement_fn
    rationale: >
      Every successful Tier 1 tool result must carry a '_run_id' field so
      the agent can immediately bind evidence_spans without guessing a source_id.
      A missing '_run_id' breaks the claim coupling contract: the agent would
      need to manually compose evidence_spans from scratch, risking errors and
      omissions. The run_id also enables the session run log which underpins
      draft_claim_from_run().
    setup:
      session_id: bench-cc-025
      slots:
        signatures:
          data:
            runoff_ratio: 0.42
    call:
      tool_name: extract_hydrological_signatures
      seed_result:
        data:
          runoff_ratio: 0.42
    assertions:
      - {path: _run_id, op: present}
      - {path: _run_id, op: startswith, expected: "sigs."}
      - {path: quality_flags, op: present}

  - id: B-026
    name: "Claim coupling: draft_claim_from_run returns evidence-bound template"
    tier: 1
    mark: bench
    category: ledger
    call_style: session_op
    rationale: >
      After a run is logged (simulated here by pre-populating the _run_log slot),
      draft_claim_from_run() must return a claim_template with evidence_spans
      pre-populated pointing to the correct run_id and metric_ref. The agent
      only needs to author the 'statement'. An absent or wrong source_id would
      mean the evidence_span points to a non-existent run — unverifiable claim.
    setup:
      session_id: bench-cc-026
      slots:
        _run_log:
          sigs.20260508.bench026.ab12:
            run_id: sigs.20260508.bench026.ab12
            tool_name: extract_hydrological_signatures
            session_id: bench-cc-026
            timestamp: "2026-05-08T10:00:00Z"
            key_outputs:
              runoff_ratio: 0.42
              baseflow_index: 0.61
    call:
      tool: draft_claim_from_run
      kwargs:
        session_id: bench-cc-026
        run_id: sigs.20260508.bench026.ab12
        metric_ref: runoff_ratio
    assertions:
      - {path: status, op: eq, expected: drafted}
      - {path: "claim_template.evidence_spans.0.source_type", op: eq, expected: run}
      - {path: "claim_template.evidence_spans.0.source_id", op: eq, expected: "sigs.20260508.bench026.ab12"}
      - {path: "claim_template.evidence_spans.0.metric_ref", op: eq, expected: runoff_ratio}
      - {path: "claim_template.claim_type", op: eq, expected: empirical_result}
      - {path: error, op: absent}

  - id: B-020
    name: "Live: delineate_watershed for USGS 01031500 (Piscataquis River, ME)"
    tier: 1
    mark: bench_live
    category: watershed
    call_style: mcp_tool
    rationale: >
      Published USGS StreamStats drainage area for 01031500 (Piscataquis River
      at Medford, ME) is 4,256 km² (USGS 2024). Allowing ±15% for methodology
      differences (NLDI vs StreamStats polygon algorithms) gives bounds of
      [3600, 4900]. If the result falls outside this range, the NLDI polygon
      or area computation is incorrect.
    call:
      tool: delineate_watershed
      kwargs:
        session_id: bench-live-020
        gauge_id: "01031500"
    assertions:
      - {path: data.area_km2, op: between, bounds: [3600, 4900]}
      - {path: data.gauge_name, op: present}
      - {path: error, op: absent}

  # ─────────────────────────────────────────────────────────────────────────
  # GROUP K: Answer Auditor (Phase 1.1) — citation grammar enforcement
  # ─────────────────────────────────────────────────────────────────────────

  - id: B-027
    name: "Auditor: fully cited prose passes with coverage=1.0"
    tier: 1
    mark: bench
    category: auditor
    call_style: session_op
    rationale: >
      Synthesis prose where every numeric literal is followed by a
      [run:<id>#<path>] marker that resolves correctly against the session
      run-log must pass the auditor with numeric_coverage=1.0 and no
      violations. This is the happy-path contract; a failure here means the
      auditor is erroneously rejecting valid, fully cited prose.
    setup:
      session_id: bench-audit-027
      slots:
        _run_log:
          sigs.20260610.bench027.ab12:
            run_id: sigs.20260610.bench027.ab12
            tool_name: extract_hydrological_signatures
            session_id: bench-audit-027
            timestamp: "2026-06-10T10:00:00Z"
            key_outputs:
              runoff_ratio: 0.42
              baseflow_index: 0.61
    call:
      tool: audit_interpretation
      kwargs:
        session_id: bench-audit-027
        prose: >
          The basin yielded a mean annual runoff ratio of 0.42
          [run:sigs.20260610.bench027.ab12#key_outputs.runoff_ratio],
          with a baseflow index of 0.61
          [run:sigs.20260610.bench027.ab12#key_outputs.baseflow_index],
          consistent with humid temperate regimes documented in the literature.
    assertions:
      - {path: passed, op: eq, expected: true}
      - {path: numeric_coverage, op: approx, expected: 1.0, tol: 0.01}
      - {path: "violations.0", op: absent}
      - {path: error, op: absent}

  - id: B-028
    name: "Auditor: uncited number triggers uncited_number violation"
    tier: 1
    mark: bench
    category: auditor
    call_style: session_op
    rationale: >
      Prose containing a bare numeric literal (0.42) with no following
      [run:...], [claim:...], or [lit:...] marker must be rejected with
      a violation of kind=uncited_number. This is the primary LLM-hallucination
      guard: fabricated numbers have no marker and therefore fail.
    setup:
      session_id: bench-audit-028
      slots:
        _run_log:
          sigs.20260610.bench028.cd34:
            run_id: sigs.20260610.bench028.cd34
            tool_name: extract_hydrological_signatures
            session_id: bench-audit-028
            timestamp: "2026-06-10T10:00:00Z"
            key_outputs:
              runoff_ratio: 0.42
    call:
      tool: audit_interpretation
      kwargs:
        session_id: bench-audit-028
        prose: "The basin yielded a mean annual runoff ratio of 0.42 with no citation marker."
    assertions:
      - {path: passed, op: eq, expected: false}
      - {path: "violations.0.kind", op: eq, expected: uncited_number}
      - {path: "violations.0.prose_value", op: eq, expected: "0.42"}
      - {path: teaching_error, op: present}

  - id: B-029
    name: "Auditor: marker references non-existent run_id → run_id_not_found"
    tier: 1
    mark: bench
    category: auditor
    call_style: session_op
    rationale: >
      If prose uses a [run:<id>#<path>] marker but the run_id is absent from
      the session run-log, the violation kind must be run_id_not_found.
      This catches the case where the LLM fabricates a plausible-looking
      run_id that was never recorded by post_run() — a more subtle form of
      hallucination than an outright uncited number.
    setup:
      session_id: bench-audit-029
      slots:
        _run_log:
          sigs.20260610.bench029.ef56:
            run_id: sigs.20260610.bench029.ef56
            tool_name: extract_hydrological_signatures
            session_id: bench-audit-029
            timestamp: "2026-06-10T10:00:00Z"
            key_outputs:
              runoff_ratio: 0.42
    call:
      tool: audit_interpretation
      kwargs:
        session_id: bench-audit-029
        prose: "The runoff ratio is 0.42 [run:FABRICATED.runid.9999#key_outputs.runoff_ratio]."
    assertions:
      - {path: passed, op: eq, expected: false}
      - {path: "violations.0.kind", op: eq, expected: run_id_not_found}
      - {path: teaching_error, op: present}

  - id: B-030
    name: "Auditor: prose value diverges from stored → value_mismatch violation"
    tier: 1
    mark: bench
    category: auditor
    call_style: session_op
    rationale: >
      When prose states 0.42 but the run-log stores 0.82 at the referenced
      JSON path, the auditor must emit a value_mismatch violation. This is
      the rounding-aware comparison that catches copy-paste errors and
      subtle drift between the agent's summary and the actual computed value.
    setup:
      session_id: bench-audit-030
      slots:
        _run_log:
          sigs.20260610.bench030.gh78:
            run_id: sigs.20260610.bench030.gh78
            tool_name: extract_hydrological_signatures
            session_id: bench-audit-030
            timestamp: "2026-06-10T10:00:00Z"
            key_outputs:
              runoff_ratio: 0.82
    call:
      tool: audit_interpretation
      kwargs:
        session_id: bench-audit-030
        prose: "The runoff ratio of 0.42 [run:sigs.20260610.bench030.gh78#key_outputs.runoff_ratio] was obtained."
    assertions:
      - {path: passed, op: eq, expected: false}
      - {path: "violations.0.kind", op: eq, expected: value_mismatch}
      - {path: "violations.0.prose_value", op: eq, expected: "0.42"}
      - {path: "violations.0.stored_value", op: approx, expected: 0.82, tol: 0.001}
      - {path: teaching_error, op: present}

  - id: B-031
    name: "Write gate: write_research_interpretation refuses uncited prose"
    tier: 1
    mark: bench
    category: auditor
    call_style: session_op
    rationale: >
      write_research_interpretation must refuse to persist synthesis prose
      that fails the Answer Auditor. The return dict must have error=audit_failed
      and a teaching_error field. Crucially, the interpretation must NOT be
      written to the session — the prose is only stored when audit passes.
      This is the enforcement boundary: the gate converts a warning into a
      hard refusal so hallucinated numbers cannot reach the session context.
    setup:
      session_id: bench-audit-031
      slots:
        signatures:
          data:
            runoff_ratio: 0.55
    call:
      tool: write_research_interpretation
      kwargs:
        session_id: bench-audit-031
        interpretation: "The basin has a runoff ratio of 0.55 with no citation marker here."
        site_name: bench-site-031
    assertions:
      - {path: error, op: eq, expected: audit_failed}
      - {path: teaching_error, op: present}
      - {path: violation_count, op: gt, expected: 0}
      - {path: written_path, op: absent}

  # ─────────────────────────────────────────────────────────────────────────
  # GROUP E: Uncertainty + promotion gate (Phase 1.3)
  # ─────────────────────────────────────────────────────────────────────────

  - id: B-032
    name: "Uncertainty validator: warns when _uncertainty absent from signatures slot"
    tier: 1
    mark: bench
    category: uncertainty
    call_style: session_op
    rationale: >
      check_uncertainty_present must return a warning ValidatorResult when the
      signatures slot has no '_uncertainty' key (point-estimate-only result).
      The quality_flag metadata must carry 'uncertainty_missing' so downstream
      tools and agents know CIs are not available for this analysis run.
    setup:
      session_id: bench-uncert-032
      slots:
        signatures:
          data:
            runoff_ratio: 0.42
            q_mean: 1.5
    call:
      tool: check_uncertainty_present
      kwargs:
        session_id: bench-uncert-032
        slot: signatures
    assertions:
      - {path: validator, op: eq, expected: uncertainty_present}
      - {path: status, op: eq, expected: warning}
      - {path: severity, op: eq, expected: medium}
      - {path: "metadata.quality_flag", op: eq, expected: uncertainty_missing}

  - id: B-033
    name: "Promotion gate: quantitative claim without uncertainty_verified is refused"
    tier: 1
    mark: bench
    category: uncertainty
    call_style: session_op
    rationale: >
      update_claim_status must refuse to promote a quantitative claim to
      'supported' without uncertainty_verified=True. The teaching_error
      explains the uncertainty gate. This enforces Phase 1.3 design contract.
    setup:
      session_id: bench-uncert-033
      claims:
        claim-q01:
          id: claim-q01
          claim: "The mean runoff ratio is 0.42."
          claim_type: quantitative
          status: tested
          confidence: medium
          confidence_rationale: "Tested against CAMELS benchmark."
          scope: {basins: ["test"], period: "1990-2000", metric: "runoff_ratio"}
          evidence_spans: [{source_type: run, source_id: "run-abc", metric_ref: runoff_ratio}]
          limitations: ["Single gauge, short record."]
    call:
      tool: update_claim_status
      kwargs:
        session_id: bench-uncert-033
        claim_id: claim-q01
        status: supported
        confidence: high
        rationale: "Verified against multiple gauges."
        uncertainty_verified: false
    assertions:
      - {path: error, op: eq, expected: uncertainty_gate}
      - {path: teaching_error, op: present}
      - {path: "teaching_error.rule", op: eq, expected: quantitative_claims_require_uncertainty}
      - {path: claim_id, op: eq, expected: claim-q01}

  - id: B-034
    name: "Promotion gate: qualitative claim reaches supported without uncertainty_verified"
    tier: 1
    mark: bench
    category: uncertainty
    call_style: session_op
    rationale: >
      The uncertainty gate only blocks quantitative claims. Qualitative claims
      should be promotable to 'supported' without uncertainty_verified=True.
      This ensures the gate is targeted and does not over-block.
    setup:
      session_id: bench-uncert-034
      claims:
        claim-q02:
          id: claim-q02
          claim: "The basin exhibits perennial flow throughout the study period."
          claim_type: qualitative
          status: tested
          confidence: medium
          confidence_rationale: "Visual inspection of hydrograph."
          scope: {basins: ["test"], period: "1990-2000"}
          evidence_spans: [{source_type: run, source_id: "run-abc", metric_ref: hydrograph}]
          limitations: ["Single observation period."]
    call:
      tool: update_claim_status
      kwargs:
        session_id: bench-uncert-034
        claim_id: claim-q02
        status: supported
        confidence: high
        rationale: "Perennial flow confirmed across full record."
        uncertainty_verified: false
    assertions:
      - {path: id, op: eq, expected: claim-q02}
      - {path: status, op: eq, expected: updated}
      - {path: error, op: absent}

  # ─────────────────────────────────────────────────────────────────────────
  # GROUP H: Capsule export (Phase 1.5)
  # ─────────────────────────────────────────────────────────────────────────

  - id: B-035
    name: "Capsule export: produces manifest, run_log.json, and replay.py"
    tier: 1
    mark: bench
    category: capsule
    call_style: session_op
    rationale: >
      export_session with format='capsule' must write capsule_manifest.json
      (SHA-256 inventory), run_log.json (evidence-binding keys), and replay.py
      (standalone verifier). n_manifest_entries must be > 0 so the capsule is
      actually non-empty. This is the acceptance gate for Phase 1.5.
    setup:
      session_id: bench-caps-035
      slots:
        _run_log:
          sigs.20260610.bench.ab12:
            run_id: sigs.20260610.bench.ab12
            tool_name: extract_hydrological_signatures
            session_id: bench-caps-035
            timestamp: "2026-06-10T00:00:00+00:00"
            key_outputs:
              q_mean: 1.25
              flow_variability: 2.10
    call:
      tool: export_session
      kwargs:
        session_id: bench-caps-035
        capsule_path: "/tmp/aihydro-bench-capsule-b035"
    assertions:
      - {path: error, op: absent}
      - {path: capsule_dir, op: present}
      - {path: manifest_file, op: present}
      - {path: n_manifest_entries, op: gt, expected: 0}
      - {path: n_files, op: gt, expected: 3}

  - id: B-036
    name: "Defensibility report: returns audit_passed, n_claims, n_cited_numbers"
    tier: 1
    mark: bench
    category: capsule
    call_style: session_op
    rationale: >
      export_session(format='defensibility_report') must return a structured
      summary dict with audit_passed, n_claims, n_cited_numbers, and
      file_saved so the agent can reason about the session's defensibility
      posture without reading the full Markdown file.
    setup:
      session_id: bench-def-036
      slots:
        _run_log:
          sigs.20260610.bench.xy99:
            run_id: sigs.20260610.bench.xy99
            tool_name: extract_hydrological_signatures
            session_id: bench-def-036
            timestamp: "2026-06-10T00:00:00+00:00"
            key_outputs:
              q_mean: 1.25
              flow_variability: 2.10
      claims:
        claim-001:
          id: claim-001
          claim: "Mean annual flow is 1.25 mm/day at this gauge."
          claim_type: empirical_result
          status: supported
          confidence: high
          confidence_rationale: "Bootstrap 90% CI does not overlap zero."
          scope: {basins: ["01031500"], period: "1990-2020"}
          evidence_spans:
            - {source_type: run, source_id: "sigs.20260610.bench.xy99", metric_ref: q_mean}
          limitations: ["Single gauge only."]
    call:
      tool: export_session
      kwargs:
        session_id: bench-def-036
        format: defensibility_report
    assertions:
      - {path: error, op: absent}
      - {path: format, op: eq, expected: defensibility_report}
      - {path: file_saved, op: present}
      - {path: n_claims, op: eq, expected: 1}
      - {path: n_cited_numbers, op: gt, expected: 0}
      - {path: uncertainty_coverage_pct, op: present}

  # ─────────────────────────────────────────────────────────────────────────
  # GROUP J: Pre-registration (Phase 1.7)
  # ─────────────────────────────────────────────────────────────────────────

  - id: B-037
    name: "Pre-registration: register_research_plan locks plan with content_hash"
    tier: 2
    mark: bench
    category: prereg
    call_style: mcp_tool
    rationale: >
      register_research_plan must lock the hypothesis and planned analyses,
      return a prereg_id and content_hash, store the plan as immutable in the
      session, and refuse a second call with a teaching error.
    setup:
      session_id: bench-prereg-037
    call:
      tool: register_research_plan
      kwargs:
        session_id: bench-prereg-037
        hypothesis: "Baseflow index at bench site exceeds 0.5."
        planned_analyses:
          - extract_hydrological_signatures
          - compute_baseflow
    assertions:
      - {path: error, op: absent}
      - {path: prereg_id, op: present}
      - {path: content_hash, op: present}
      - {path: locked_at, op: present}
      - {path: n_planned, op: eq, expected: 2}

  - id: B-038
    name: "Pre-registration: second call returns plan_already_locked teaching error"
    tier: 2
    mark: bench
    category: prereg
    call_style: session_op
    rationale: >
      A locked research plan must be immutable. A second call to
      register_research_plan on the same session must return
      error='plan_already_locked' with a teaching_error block, preserving
      the original plan unchanged.
    setup:
      session_id: bench-prereg-038
      slots:
        _research_plan:
          prereg_id: "prereg.benchpre.20260610.ab1234"
          hypothesis: "Original hypothesis that must not be overwritten."
          planned_analyses:
            - extract_hydrological_signatures
          content_hash: "ab1234567890abcd"
          locked_at: "2026-06-10T00:00:00+00:00"
          locked: true
    call:
      tool: register_research_plan
      kwargs:
        session_id: bench-prereg-038
        hypothesis: "Replacement hypothesis — must be blocked."
        planned_analyses:
          - calibrate_model
    assertions:
      - {path: error, op: eq, expected: plan_already_locked}
      - {path: teaching_error, op: present}

  # ─────────────────────────────────────────────────────────────────────────
  # GROUP K: Validator expansion (Phase 1.8)
  # ─────────────────────────────────────────────────────────────────────────

  - id: B-039
    name: "Validator: check_record_length fails on < 10-year record"
    tier: 2
    mark: bench
    category: validators
    call_style: session_op
    rationale: >
      check_record_length must return status='fail' with severity='high'
      when n_days < 3650 (< 10 years). The quality_flag 'record_too_short'
      must be present so post-run middleware can propagate it.
    setup:
      session_id: bench-rl-039
      slots:
        streamflow:
          data:
            gauge_id: "01031500"
            n_days: 1000
            units: m3/s
          meta:
            tool: fetch_streamflow_data
            params: {}
    call:
      tool: check_record_length
      kwargs:
        session_id: bench-rl-039
    assertions:
      - {path: error, op: absent}
      - {path: status, op: eq, expected: fail}
      - {path: severity, op: eq, expected: high}
      - {path: metadata.quality_flag, op: eq, expected: record_too_short}

  - id: B-040
    name: "Validator: check_usgs_qualification_codes warns on provisional data"
    tier: 2
    mark: bench
    category: validators
    call_style: session_op
    rationale: >
      check_usgs_qualification_codes must return status='warning' with
      quality_flag='provisional_data' when the streamflow metadata
      contains provisional=true.
    setup:
      session_id: bench-qc-040
      slots:
        streamflow:
          data:
            gauge_id: "01031500"
            n_days: 7300
            units: m3/s
          meta:
            tool: fetch_streamflow_data
            provisional: true
            params: {}
    call:
      tool: check_usgs_qualification_codes
      kwargs:
        session_id: bench-qc-040
    assertions:
      - {path: error, op: absent}
      - {path: status, op: eq, expected: warning}
      - {path: metadata.quality_flag, op: eq, expected: provisional_data}

  - id: B-041
    name: "Validator: check_regulated_basin warns on regulated=true flag"
    tier: 2
    mark: bench
    category: validators
    call_style: session_op
    rationale: >
      check_regulated_basin must return status='warning' with
      quality_flag='regulated_basin' when the delineation slot contains
      regulated=true. Natural-flow statistics in a regulated basin are
      scientifically invalid without correction.
    setup:
      session_id: bench-rb-041
      slots:
        delineation:
          data:
            area_km2: 1234
            regulated: true
          meta:
            tool: delineate_watershed
            params: {}
    call:
      tool: check_regulated_basin
      kwargs:
        session_id: bench-rb-041
    assertions:
      - {path: error, op: absent}
      - {path: status, op: eq, expected: warning}
      - {path: severity, op: eq, expected: high}
      - {path: metadata.quality_flag, op: eq, expected: regulated_basin}

  # ─────────────────────────────────────────────────────────────────────────
  # GROUP K: Fleet-scale experiment tools (Phase 2.1)
  # ─────────────────────────────────────────────────────────────────────────

  - id: B-043
    name: "define_experiment: returns stable experiment_id for known design"
    tier: 1
    mark: bench
    category: experiments
    call_style: session_op
    rationale: >
      define_experiment must produce a deterministic experiment_id derived from
      the content hash of the design matrix (name, tool, features, params,
      metrics). Two identical calls must return the same ID, and the already_exists
      path must return status='already_exists' on the second call. This guarantees
      that experiments are deduplicated across an agent session without requiring
      an external registry.
    setup:
      session_id: bench-exp-043
      slots: {}
    call:
      tool: define_experiment
      kwargs:
        session_id: bench-exp-043
        name: "CAMELS 3 basins"
        tool: extract_hydrological_signatures
        features: ["01013500", "01031500", "01047000"]
        params: {start_date: "1990-01-01", end_date: "2010-12-31"}
        metrics: ["q_mean", "runoff_ratio", "baseflow_index"]
    assertions:
      - {path: error, op: absent}
      - {path: experiment_id, op: present}
      - {path: n_features, op: eq, expected: 3}
      - {path: metrics, op: contains, expected: "q_mean"}
      - {path: experiment_id, op: contains, expected: "exp."}

  - id: B-044
    name: "define_experiment: already_exists on duplicate call"
    tier: 1
    mark: bench
    category: experiments
    call_style: session_op
    rationale: >
      A second call with the same design must return status='already_exists'
      rather than creating a duplicate entry. This protects the session store
      from growing unboundedly when an agent re-runs the same design step.
    setup:
      session_id: bench-exp-044
      slots: {}
    call:
      tool: define_experiment
      kwargs:
        session_id: bench-exp-044
        name: "CAMELS 3 basins"
        tool: extract_hydrological_signatures
        features: ["01013500", "01031500", "01047000"]
        params: {start_date: "1990-01-01", end_date: "2010-12-31"}
        metrics: ["q_mean", "runoff_ratio", "baseflow_index"]
    pre_call:
      - tool: define_experiment
        kwargs:
          session_id: bench-exp-044
          name: "CAMELS 3 basins"
          tool: extract_hydrological_signatures
          features: ["01013500", "01031500", "01047000"]
          params: {start_date: "1990-01-01", end_date: "2010-12-31"}
          metrics: ["q_mean", "runoff_ratio", "baseflow_index"]
    assertions:
      - {path: status, op: eq, expected: already_exists}
      - {path: error, op: absent}

  # GROUP L: Global claim registry (Phase 2.2)
  # ─────────────────────────────────────────────────────────────────────────

  - id: B-045
    name: "promote_claim_to_registry: empirical claim writes real registry entry"
    tier: 1
    mark: bench
    category: registry
    rationale: >
      promote_claim_to_registry must write a real entry to
      ~/.aihydro/registry/claims.jsonl and return a deterministic registry_id
      (reg.<session>.<date>.<hash>) with status='promoted'. The gate must pass
      for an empirical claim that has at least one evidence_span, at least one
      limitation, and status in {supported, weakly_supported}.
    call_style: session_op
    setup:
      session_id: bench-reg-045
      slots: {}
      claims:
        bench-claim-001:
          id: bench-claim-001
          claim: >-
            Mean annual streamflow at gauge 01013500 follows a consistent
            seasonal pattern over the 1990-2010 reference period.
          claim_type: empirical_result
          status: supported
          confidence: medium
          confidence_rationale: >-
            Consistent pattern observed across a 20-year USGS daily record
            with no structural breaks detected by visual inspection.
          scope:
            basins: ["01013500"]
            period: "1990-2010"
            metric: null
          limitations:
            - "Limited to one gauge; regional generalisability not tested"
            - "Does not account for potential upstream regulation changes"
          evidence_spans:
            - source_type: dataset
              source_id: streamflow
              metric_ref: null
              description: "20-yr USGS NWIS daily discharge record"
          evidence: []
          contradictions: []
          citations: []
    call:
      tool: promote_claim_to_registry
      kwargs:
        session_id: bench-reg-045
        claim_id: bench-claim-001
        researcher_approved: true
    assertions:
      - {path: error, op: absent}
      - {path: status, op: eq, expected: promoted}
      - {path: registry_id, op: present}
      - {path: registry_id, op: contains, expected: "reg."}

  # GROUP M: Skeptic / referee agent (Phase 2.3)
  # ─────────────────────────────────────────────────────────────────────────

  - id: B-046
    name: "run_skeptic: scope overreach detected when gauge outside claim scope"
    tier: 1
    mark: bench
    category: skeptic
    call_style: session_op
    rationale: >
      run_skeptic must detect scope overreach when the interpretation text
      references a USGS gauge ID (8-digit number) that is not covered by any
      registered claim scope. This is the planted-overreach acceptance criterion
      from the Phase 2.3 spec: verdict must be 'advisory' and the issue_type
      'scope_overreach' must appear in the issues list.
    setup:
      session_id: bench-sk-046
      slots: {}
      claims:
        bench-claim-046:
          id: bench-claim-046
          claim: "Mean annual flow at 01013500 is representative of the region."
          claim_type: empirical_result
          status: supported
          confidence: medium
          confidence_rationale: >-
            Based on 20-year USGS daily discharge record with no data gaps.
          scope:
            basins: ["01013500"]
            period: "1990-2010"
            metric: null
          limitations: ["Limited to one gauge"]
          evidence_spans: []
          evidence: []
          contradictions: []
          citations: []
    call:
      tool: run_skeptic
      kwargs:
        session_id: bench-sk-046
        interpretation_text: >-
          Mean annual streamflow at gauge 01013500 is 1.15 m3/s
          [claim:bench-claim-046]. Gauge 09380000 shows comparable behaviour
          in the Colorado Basin.
    assertions:
      - {path: error, op: absent}
      - {path: verdict, op: eq, expected: advisory}
      - {path: n_claims_checked, op: eq, expected: 1}

  - id: B-047
    name: "run_skeptic: clean session returns verdict=clean"
    tier: 1
    mark: bench
    category: skeptic
    call_style: session_op
    rationale: >
      run_skeptic must return verdict='clean' with zero issues when the
      interpretation text only references gauges that are covered by claim
      scopes, no stale/retracted claims are cited, and no high-risk unvalidated
      assumptions are present. This guards the false-positive rate.
    setup:
      session_id: bench-sk-047
      slots: {}
      claims:
        bench-claim-047:
          id: bench-claim-047
          claim: "Baseflow index at 01013500 exceeds 0.5 over the 1990-2010 period."
          claim_type: empirical_result
          status: supported
          confidence: high
          confidence_rationale: >-
            Nathan-McMahon baseflow filter on 7300-day daily discharge record
            shows consistent result across three passes.
          scope:
            basins: ["01013500"]
            period: "1990-2010"
            metric: null
          limitations: ["Single gauge; no regional comparison performed"]
          evidence_spans: []
          evidence: []
          contradictions: []
          citations: []
    call:
      tool: run_skeptic
      kwargs:
        session_id: bench-sk-047
        interpretation_text: >-
          Gauge 01013500 shows a baseflow index above 0.5 [claim:bench-claim-047],
          indicating a groundwater-dominated regime for the 1990-2010 period.
    assertions:
      - {path: error, op: absent}
      - {path: verdict, op: eq, expected: clean}
      - {path: passed, op: eq, expected: true}

  # GROUP N: Literature grounding — passage index (Phase 2.4)
  - id: B-048
    name: "search_passages_tool: graceful degradation when index absent"
    tier: 2
    mark: bench
    category: literature
    call_style: mcp_tool
    rationale: >
      search_passages_tool must not raise when the passage index has not yet
      been built. It must return indexed=false and an empty matches list so
      the agent can detect the uninitialised state and prompt the researcher
      to run index_passages first.
    call:
      tool: search_passages_tool
      kwargs:
        query: "KGE efficiency"
        n: 5
    assertions:
      - {path: error, op: absent}
      - {path: indexed, op: eq, expected: false}
      - {path: n_matches, op: eq, expected: 0}

  - id: B-049
    name: "resolve_passage: graceful degradation when index absent"
    tier: 3
    mark: bench
    category: literature
    call_style: mcp_tool
    rationale: >
      resolve_passage must not raise when the passage index has not yet been
      built. It must return found=false so the agent can detect the
      uninitialised state rather than crashing mid-interpretation.
    call:
      tool: resolve_passage
      kwargs:
        passage_hash: "deadbeef12345678"
    assertions:
      - {path: error, op: absent}
      - {path: found, op: eq, expected: false}

  - id: B-042
    name: "Validator: check_record_length passes on 25-year record"
    tier: 2
    mark: bench
    category: validators
    call_style: session_op
    rationale: >
      check_record_length must return status='pass' when n_days >= 7300
      (>= 20 years). This verifies the pass branch and that n_days is
      included in the metadata for downstream traceability.
    setup:
      session_id: bench-rl-042
      slots:
        streamflow:
          data:
            gauge_id: "01031500"
            n_days: 9125
            units: m3/s
          meta:
            tool: fetch_streamflow_data
            params: {}
    call:
      tool: check_record_length
      kwargs:
        session_id: bench-rl-042
    assertions:
      - {path: error, op: absent}
      - {path: status, op: eq, expected: pass}
      - {path: metadata.n_days, op: eq, expected: 9125}

  # GROUP O: HydroResearch-Bench — end-to-end citation + interpretation pipeline (Phase 2.5)
  # These 11 tasks exercise the full question→answer defensibility pipeline:
  # audit gate, claim lifecycle, defensibility report, and scorecard assertions.

  - id: B-050
    name: "Audit: prose with no numbers passes with 100% coverage"
    tier: 1
    mark: bench
    category: hrb
    call_style: session_op
    rationale: >
      The auditor must report passed=true and total_numeric_count=0 when the
      prose contains no numeric literals. This is the trivially clean baseline.
      If this fails, the numeric-extraction regex has a false positive.
    setup:
      session_id: bench-hrb-050
      slots: {}
      claims: {}
    call:
      tool: audit_interpretation
      kwargs:
        session_id: bench-hrb-050
        prose: "Streamflow patterns indicate a groundwater-dominated regime."
    assertions:
      - {path: error, op: absent}
      - {path: passed, op: eq, expected: true}
      - {path: total_numeric_count, op: eq, expected: 0}

  - id: B-051
    name: "Audit: uncited number produces uncited_number violation"
    tier: 1
    mark: bench
    category: hrb
    call_style: session_op
    rationale: >
      A numeric literal without any [run:...] or [lit:...] marker must
      produce a violation of kind 'uncited_number' and flip passed to false.
      This is the primary gate preventing hallucinated numbers.
    setup:
      session_id: bench-hrb-051
      slots: {}
      claims: {}
    call:
      tool: audit_interpretation
      kwargs:
        session_id: bench-hrb-051
        prose: "The KGE score of 0.82 indicates good model performance."
    assertions:
      - {path: error, op: absent}
      - {path: passed, op: eq, expected: false}
      - {path: violations.0.kind, op: eq, expected: uncited_number}

  - id: B-052
    name: "Audit: [lit:tag] citation satisfies coverage"
    tier: 1
    mark: bench
    category: hrb
    call_style: session_op
    rationale: >
      A number followed by a [lit:tag] marker must count as cited.
      The audit must pass and cited_numeric_count must equal 1.
      This verifies the whitelist path through the auditor.
    setup:
      session_id: bench-hrb-052
      slots: {}
      claims: {}
    call:
      tool: audit_interpretation
      kwargs:
        session_id: bench-hrb-052
        prose: "The benchmark threshold of 0.5 [lit:Nash1970] is widely accepted."
    assertions:
      - {path: error, op: absent}
      - {path: passed, op: eq, expected: true}
      - {path: cited_numeric_count, op: eq, expected: 1}
      - {path: numeric_coverage, op: eq, expected: 1.0}

  - id: B-053
    name: "Audit: [run:id#path] against seeded run_log resolves to pass"
    tier: 1
    mark: bench
    category: hrb
    call_style: session_op
    rationale: >
      A [run:id#path] marker that resolves to the correct stored value must
      satisfy coverage and flip passed to true. This is the core provenance
      mechanism: numbers traced to real tool outputs.
    setup:
      session_id: bench-hrb-053
      slots: {}
      claims: {}
      run_log:
        r-053:
          kge: 0.82
    call:
      tool: audit_interpretation
      kwargs:
        session_id: bench-hrb-053
        prose: "The model achieved 0.82 [run:r-053#kge] on the calibration period."
    assertions:
      - {path: error, op: absent}
      - {path: passed, op: eq, expected: true}
      - {path: numeric_coverage, op: eq, expected: 1.0}
      - {path: cited_numeric_count, op: eq, expected: 1}

  - id: B-054
    name: "Audit: value mismatch between prose and run_log produces violation"
    tier: 1
    mark: bench
    category: hrb
    call_style: session_op
    rationale: >
      If prose says 0.82 but the run_log stores 0.75 at that path, the
      auditor must produce a value_mismatch violation. This prevents
      copy-paste errors and fabricated numbers that happen to cite a real run.
    setup:
      session_id: bench-hrb-054
      slots: {}
      claims: {}
      run_log:
        r-054:
          kge: 0.75
    call:
      tool: audit_interpretation
      kwargs:
        session_id: bench-hrb-054
        prose: "The model achieved 0.82 [run:r-054#kge] on the calibration period."
    assertions:
      - {path: error, op: absent}
      - {path: passed, op: eq, expected: false}
      - {path: violations.0.kind, op: eq, expected: value_mismatch}

  - id: B-055
    name: "write_research_interpretation: uncited number is refused"
    tier: 2
    mark: bench
    category: hrb
    call_style: session_op
    rationale: >
      write_research_interpretation must refuse prose containing an uncited
      numeric literal. The audit gate must fire before the interpretation is
      persisted to disk. The return dict must carry error=audit_failed and
      audit_passed=false so the agent knows to revise the text.
    setup:
      session_id: bench-hrb-055
      slots: {}
      claims: {}
    call:
      tool: write_research_interpretation
      kwargs:
        session_id: bench-hrb-055
        interpretation: "The NSE value of 0.90 indicates a well-calibrated model."
        site_name: "Test Gauge"
    assertions:
      - {path: error, op: eq, expected: audit_failed}
      - {path: audit_passed, op: eq, expected: false}
      - {path: violation_count, op: ge, expected: 1}

  - id: B-056
    name: "write_research_interpretation: fully [lit:...] cited prose passes"
    tier: 2
    mark: bench
    category: hrb
    call_style: session_op
    rationale: >
      write_research_interpretation must accept prose where every numeric
      literal is bound to a [lit:tag] marker. The interpretation must be
      persisted and audit_passed=true must appear in the return dict.
    setup:
      session_id: bench-hrb-056
      slots: {}
      claims: {}
    call:
      tool: write_research_interpretation
      kwargs:
        session_id: bench-hrb-056
        interpretation: >-
          The NSE threshold of 0.5 [lit:Nash1970] is routinely used as
          a model adequacy benchmark. The KGE threshold of 0.41 [lit:Gupta2009]
          is a complementary criterion accounting for bias and variability.
        site_name: "Test Gauge"
    assertions:
      - {path: error, op: absent}
      - {path: audit_passed, op: eq, expected: true}
      - {path: numeric_coverage, op: eq, expected: 1.0}

  - id: B-057
    name: "list_claims: returns pre-seeded claim from session"
    tier: 2
    mark: bench
    category: hrb
    call_style: session_op
    rationale: >
      list_claims must return a list containing any claims pre-seeded in
      the session. This verifies that the claims ledger is persisted and
      readable. Use len_gte operator since the result is a bare list.
    setup:
      session_id: bench-hrb-057
      slots: {}
      claims:
        bench-claim-057:
          id: bench-claim-057
          claim: "KGE > 0.5 at gauge 01013500."
          claim_type: empirical_result
          status: proposed
          confidence: low
          confidence_rationale: "Preliminary estimate."
          scope:
            basins: ["01013500"]
            period: "1990-2010"
            metric: null
          limitations: ["Single gauge"]
          evidence_spans: []
          evidence: []
          contradictions: []
          citations: []
    call:
      tool: list_claims
      kwargs:
        session_id: bench-hrb-057
    assertions:
      - {path: "", op: len_gte, expected: 1}

  - id: B-058
    name: "export_session: defensibility_report writes file and returns path"
    tier: 2
    mark: bench
    category: hrb
    call_style: session_op
    rationale: >
      export_session with format=defensibility_report must produce a
      markdown file and return its path in file_saved. The report format
      is the principal artifact for journal review — if it fails to write
      the researcher cannot submit defensibility evidence.
    setup:
      session_id: bench-hrb-058
      slots: {}
      claims: {}
    call:
      tool: export_session
      kwargs:
        session_id: bench-hrb-058
        format: defensibility_report
    assertions:
      - {path: error, op: absent}
      - {path: format, op: eq, expected: defensibility_report}
      - {path: file_saved, op: present}

  - id: B-059
    name: "Claim lifecycle: add_claim then update_claim_status to supported"
    tier: 1
    mark: bench
    category: hrb
    call_style: session_op
    rationale: >
      A hypothesis claim must be able to progress from proposed to
      supported via update_claim_status without triggering the
      uncertainty gate (hypothesis claims are exempt). This end-to-end
      lifecycle test verifies the claims ledger write path.
    setup:
      session_id: bench-hrb-059
      slots: {}
      claims: {}
    pre_call:
      - tool: add_claim
        kwargs:
          session_id: bench-hrb-059
          claim_id: bench-lc-059
          statement: "We hypothesise that baseflow dominates during summer low-flow periods."
          claim_type: hypothesis
          status: proposed
          confidence: low
          confidence_rationale: "Initial expert judgement."
          basins: ["01013500"]
          period: "1990-2010"
    call:
      tool: update_claim_status
      kwargs:
        session_id: bench-hrb-059
        claim_id: bench-lc-059
        status: supported
        confidence: medium
        rationale: "Confirmed by Nathan-McMahon baseflow separation."
    assertions:
      - {path: id, op: eq, expected: bench-lc-059}
      - {path: error, op: absent}

  - id: B-060
    name: "get_session_health: empty session returns zero warnings"
    tier: 3
    mark: bench
    category: hrb
    call_style: session_op
    rationale: >
      get_session_health must not produce warnings for a freshly-created
      empty session that has no watershed or interpretation set. The health
      check should be a safe no-op on minimal sessions. n_warnings == 0
      is the clean baseline that drift-detection tests compare against.
    setup:
      session_id: bench-hrb-060
      slots: {}
      claims: {}
    call:
      tool: get_session_health
      kwargs:
        session_id: bench-hrb-060
    assertions:
      - {path: error, op: absent}
      - {path: session_id, op: eq, expected: bench-hrb-060}
      - {path: n_warnings, op: eq, expected: 0}
