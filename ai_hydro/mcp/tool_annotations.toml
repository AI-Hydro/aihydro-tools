# MCP tool annotations -- one row per registered tool (U5a).
#
# Applied by ai_hydro.mcp.tool_surface.apply_tool_annotations() after all tools are
# registered (same pass pattern as _tag_tools_with_tier_meta) and served in tools/list as
# ToolAnnotations. tests/test_tool_annotations.py fails when a registered tool lacks a row,
# when a row has no tool, and when a tool that writes is marked readOnlyHint = true.
#
# Classification rules (grep-backed against the code of each tool and the helpers it calls):
#   readOnlyHint    true ONLY if the tool writes nothing (no session slot, session field, workspace
#                   file, map/preview command file, ledger/registry/claims, job, cache entry,
#                   profile/project/skill file) AND makes no network call (including Earth Engine
#                   initialisation).
#   destructiveHint true if it deletes, cancels, or overwrites researcher-authored state (claims,
#                   assumptions, interpretation, notes cleared, profile, skills, cache entries, a
#                   running job) or can run arbitrary code. Recomputed derived slots/files and
#                   queue files are overwrites of derived data, so they are NOT destructive.
#   idempotentHint  true if repeating the call with the same arguments leaves the same state
#                   (derived-slot overwrite, replace-style commands, deletes). false for appends,
#                   new job ids, or arbitrary code.
#   openWorldHint   true if the tool calls any network service (NLDI, USGS, GEE, Crossref, DEM and
#                   forcing servers, ...) or executes arbitrary code.
#
# Recording that is NOT counted as a tool write (it happens for every call and is infrastructure):
#   - RunRecordMiddleware's run record and post_run()'s run-log row for the call itself,
#   - _resolve_session bookkeeping (chat-binding store, one-time workspace_dir backfill),
#   - creating an empty tool-owned cache/queue root directory (mkdir exist_ok) before listing it.
# Everything else a tool persists makes readOnlyHint false.
#
# `source` is the distribution that registers the tool (builtin = aihydro-tools); rows for an
# optional plugin are only enforced when that plugin is importable.

