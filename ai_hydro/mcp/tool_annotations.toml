# MCP tool annotations -- one row per registered tool (U5a).
#
# Applied by ai_hydro.mcp.tool_surface.apply_tool_annotations() after all tools are
# registered (same pass pattern as _tag_tools_with_tier_meta) and served in tools/list as
# ToolAnnotations. Hosts (the extension's explorer) trust readOnlyHint, so it is the claim most
# worth checking. What is actually enforced:
#   * tests/test_tool_surface.py: every registered tool has a row and every row a tool; no
#     readOnlyHint=true tool calls a known writer, subprocess or network function (a static AST
#     scan that follows helpers; it is a deny-list, not a proof);
#   * tests/test_readonly_runtime_guard.py: every readOnlyHint=true tool is called against a fixture
#     session under sys.addaudithook and must produce no file write, rename/remove, socket, DNS or
#     subprocess event outside the allowlist below. It exercises the calls the example arguments
#     reach, so a branch those arguments never take is covered by the static scan only;
#   * a read-only call also resolves its session without side effects (no chat rebinding, no
#     workspace_dir backfill/save): ToolSurfaceMiddleware derives that from this table.
# The `evidence` column is a grouped justification plus the guard result for the tool; the
# classification itself was made by reading the code, and is not machine-proved.
#
# Classification rules:
#   readOnlyHint    true ONLY if the tool writes nothing (no session slot or field, workspace file,
#                   map/preview command file, claim/ledger/registry, job, cache entry, profile or
#                   skill file) AND makes no network call (Earth Engine initialisation included).
#   destructiveHint true if it deletes, cancels, or overwrites researcher-authored state (claims,
#                   assumptions, interpretation, cleared slots, profile, skills, cache entries, a
#                   running job) or can run arbitrary code. Recomputed derived slots/files and
#                   queue files are overwrites of derived data, so they are NOT destructive.
#   idempotentHint  true if repeating the call with the same arguments leaves the same state
#                   (derived-slot overwrite, replace-style commands, deletes). false for appends,
#                   new job ids, or arbitrary code.
#   openWorldHint   true if the tool calls any network service (NLDI, USGS, GEE, Crossref, DEM and
#                   forcing servers, ...) or executes arbitrary code.
#
# The only things a readOnlyHint=true call may write (the runtime allowlist):
#   - run records: the middleware's sealed run record and post_run()'s run-log row for the call
#     itself (<session>.runlog.sqlite3). This is evidence-minting about the call; nothing else;
#   - creating an EMPTY tool-owned directory (an aihydro-data cache root) with mkdir;
#   - interpreter housekeeping (__pycache__, matplotlib/fontconfig caches).
# _resolve_session bookkeeping (chat binding, workspace_dir backfill) is NOT allowed for read-only
# calls: it is switched off for them.
#
# Optional vocabulary keys (data only; T-A1). A row may add any of these; absence means "not in
# that class". They are served in tools/list `_meta` under the `aihydro/` namespace and change no
# hint above. Hosts read them; the server never branches on a tool name for them.
#   effect = "ui"          the tool only queues a command for the map/preview host (a one-shot file
#                          in map_commands/ or preview_commands/) and reads session/catalog state;
#                          it writes no session, claim, workspace file or network. -> _meta["aihydro/effect"]
#   requiresConsent = true the tool records or changes facts about the researcher (profile,
#                          observations); a host should ask the person first.
#                          -> _meta["aihydro/requiresConsent"]
#   audience = "host"      the tool is for the host application, not the agent; a host should not
#                          list it to the model and should refuse agent-originated calls.
#                          -> _meta["aihydro/audience"]. The project-registry operations of T-P1 have it
#                          (ensure_project, rename_project, set_project_default_study,
#                          add_project_study, remove_project_study).
# tests/test_tool_surface.py checks each class: `ui` tools only reach the map/preview command
# writers (static scan plus an audit-hook run), and the vocabulary is closed.
#
#   acquires = true        the tool's job is to fetch external data (observations, forcing, attributes,
#                          geometry) into the study. Read by the answer audit's lineage check to decide
#                          whether a run "acquired data"; open-world alone does not mean that (a
#                          citation lookup, a service status check, a network context query are
#                          open-world and acquire no study data). -> _meta["aihydro/acquires"]
#
# `source` is the distribution that registers the tool (builtin = aihydro-tools); rows for an
# optional plugin are only enforced when that plugin is importable.

