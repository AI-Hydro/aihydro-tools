[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aihydro-tools"
version = "2.0.0"
description = "AI-Hydro: hydrological research tools as an MCP server for AI agents"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Mohammad Galib", email = "mgalib@purdue.edu"}
]
readme = "README.md"
keywords = ["hydrology", "watershed", "geospatial", "MCP", "agentic", "CAMELS", "FAIR"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: GIS",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# ── Core dependencies (minimal — always installed) ──────────────────────────
# fastmcp is required because the console script (aihydro-mcp) needs it.
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "python-dateutil>=2.8.2",
    "pyyaml>=6.0.0",
    "hydrofunctions>=0.2.0",
    "fastmcp>=2.0.0",
]

# ── Optional extras (semantic layers) ────────────────────────────────────────
[project.optional-dependencies]

# Foundation geo stack (shared by data + analysis)
geo = [
    "geopandas>=0.13.0",
    "shapely>=2.0.0",
    "pyproj>=3.6.0",
]

# Data retrieval: streamflow, forcing, land cover, soil, CAMELS
data = [
    "aihydro-tools[geo]",
    "pynhd>=0.16.0",
    "pygeohydro>=0.16.0",
    "pygridmet>=0.15.0",
    "xarray>=2023.0.0",
]

# Analysis: watershed, signatures, TWI, geomorphic, curve number
analysis = [
    "aihydro-tools[geo]",
    "rioxarray>=0.15.0",
    "xarray>=2023.0.0",
    "rasterio>=1.3.0",
    "py3dep>=0.15.0",
    "xrspatial>=0.3.0",
    "pysheds>=0.3.0",
    "scipy>=1.11.0",
]

# Modelling: HBV-light (PyTorch), NeuralHydrology LSTM
modelling = [
    "torch>=2.0.0",
]

# MCP server extras (fastmcp is already a core dep; this group is a no-op placeholder)
mcp = []

# Visualization helpers
viz = [
    "matplotlib>=3.7.0",
    "plotly>=5.18.0",
    "folium>=0.15.0",
]

# Full install: all tools + MCP server (no RAG)
all = [
    "aihydro-tools[data,analysis,modelling,mcp,viz]",
]

# Development
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

# ── Entry points ─────────────────────────────────────────────────────────────
[project.scripts]
aihydro-mcp = "ai_hydro.mcp:main"

# Community plugin tool entry point namespace.
# Third-party packages add tools in their own pyproject.toml:
#   [project.entry-points."aihydro.tools"]
#   flood_frequency = "my_package.tools:flood_freq_tool"
[project.entry-points."aihydro.tools"]

# Community plugin knowledge entry point namespace.
# Third-party packages contribute library reference cards:
#   [project.entry-points."aihydro.knowledge"]
[project.entry-points."aihydro.skills"]
# Community packages contribute workflow skills (SKILL.md files):
#   [project.entry-points."aihydro.skills"]
#   flood_skills = "my_pkg.skills:get_skills_dir"
# where get_skills_dir() returns a Path to a dir of *.md skill files.

[project.entry-points."aihydro.clis"]
# Community packages advertise their CLIs to list_relevant_clis():
#   [project.entry-points."aihydro.clis"]
#   swat = "swatplus_builder.aihydro.cli_descriptor:descriptor"
# where descriptor() returns {name, binary, description, help_subcommand}.

#   my_lib = "my_package.knowledge:get_refs_dir"
# where get_refs_dir() returns a pathlib.Path to a dir of *.json files.
[project.entry-points."aihydro.knowledge"]

# ── URLs ──────────────────────────────────────────────────────────────────────
[project.urls]
Homepage = "https://github.com/AI-Hydro/aihydro-tools"
Documentation = "https://github.com/AI-Hydro/AI-Hydro/wiki"
Repository = "https://github.com/AI-Hydro/aihydro-tools"
Issues = "https://github.com/AI-Hydro/aihydro-tools/issues"

# ── Package discovery ─────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
include = ["ai_hydro*"]

[tool.setuptools.package-data]
ai_hydro = []
"ai_hydro.knowledge" = ["library_refs/*.json"]

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
markers = [
    "live: end-to-end tests requiring internet and full deps (deselect with -m 'not live')",
]

# ── Ruff linting ──────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
