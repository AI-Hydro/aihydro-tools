name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev + all extras
        run: |
          python -m pip install --upgrade pip
          # The optional modelling backend is intentionally private and is
          # therefore not installable from public CI. Modelling integration
          # tests use pytest.importorskip when that package is unavailable.
          pip install import-linter
          pip install "aihydro-core[contracts] @ git+https://github.com/AI-Hydro/aihydro-core.git@e47e5d9" "aihydro-data @ git+https://github.com/AI-Hydro/AIhydro-data.git@9385eea" "aihydro-watershed @ git+https://github.com/AI-Hydro/aihydro-watershed.git@fc8e4f2" "pygeoglim @ git+https://github.com/galib9690/pygeoglim.git@ebf4ae9"
          pip install -e ".[analysis,data,delineation,gee,mcp,viz,dev]" pyyaml

      - name: Lint with ruff (advisory — pre-existing debt, not yet a merge gate)
        continue-on-error: true
        run: ruff check ai_hydro tests

      - name: Layering guard (AST + import-linter)
        run: |
          pytest tests/test_layering.py -q
          lint-imports

      - name: Run offline suite (excludes bench/bench_live — see bench.yml)
        run: pytest -m "not live and not bench and not bench_live" -q --tb=short
