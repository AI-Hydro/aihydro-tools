name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev + extras
        run: |
          pip install import-linter
          pip install -e ".[analysis,data,delineation,gee,mcp,viz,dev]" pyyaml
          # The modelling-backed tools are tested, not skipped: tests/conftest.py turns a
          # modelling skip into a failure when CI is set. CPU-only torch keeps this small;
          # the neuralhydrology extra is not needed (tests fake backend availability).
          pip install "aihydro-modelling[torch]>=0.6.2,<0.7" \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint with ruff (advisory — pre-existing debt, not yet a merge gate)
        continue-on-error: true
        run: ruff check ai_hydro tests

      - name: Layering guard (AST + import-linter)
        run: |
          pytest tests/test_layering.py -q
          lint-imports

      - name: Run offline suite (excludes bench/bench_live — see bench.yml)
        run: pytest -m "not live and not bench and not bench_live" -q --tb=short
