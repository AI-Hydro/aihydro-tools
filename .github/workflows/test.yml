name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev + extras
        run: |
          pip install import-linter
          pip install -e ".[analysis,data,delineation,gee,mcp,viz,dev]" pyyaml
          # aihydro-modelling is a PRIVATE repository: this public job cannot install it (and will
          # not hold a token to do so), so the tests that need it SKIP here, by design. They run
          # with no skips allowed in the private repo's workflow (aihydro-modelling,
          # .github/workflows/tools-integration.yml), which checks out this repo at main or at a
          # dispatched ref and sets AIHYDRO_REQUIRE_MODELLING=1 (see tests/conftest.py).

      - name: Lint with ruff (advisory — pre-existing debt, not yet a merge gate)
        continue-on-error: true
        run: ruff check ai_hydro tests

      - name: Layering guard (AST + import-linter)
        run: |
          pytest tests/test_layering.py -q
          lint-imports

      - name: Run offline suite (excludes bench/bench_live — see bench.yml)
        run: pytest -m "not live and not bench and not bench_live" -q --tb=short

  stdio-guard-os:
    # The MCP server speaks JSON-RPC on stdout; the guard (ai_hydro/mcp/stdio_guard.py) reserves it.
    # Its fd dup/dup2 behaviour differs by OS, so the protocol test runs on Windows and macOS too.
    name: stdio guard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package with mcp + dev
        run: pip install -e ".[mcp,dev]"
      - name: stdio protocol guard
        run: python -m pytest -q tests/test_stdio_protocol_guard.py -p no:cacheprovider -x -k 'run_stdio_guarded and default' # DEBUG-TEMP
        continue-on-error: true
      - name: DEBUG-TEMP windows child inheritance
        run: |
          'x' | python scripts/_dbg_win.py
