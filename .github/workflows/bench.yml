name: aihydro-bench

on:
  push:
    branches: [main]
  schedule:
    # Nightly at 02:00 UTC — includes bench_live tasks
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      include_live:
        description: "Include live API tasks (bench_live mark)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

jobs:
  bench-fixture:
    name: Fixture tasks (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[all,dev]"

      - name: Run bench fixture tasks
        run: pytest tests/test_bench.py -m bench -v --tb=short

  bench-live:
    name: Live API tasks (nightly only)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.include_live == 'true')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package + dev deps
        run: pip install -e ".[all,dev]"

      - name: Run bench live tasks
        run: pytest tests/test_bench.py -m bench_live -v --tb=short
        timeout-minutes: 20
