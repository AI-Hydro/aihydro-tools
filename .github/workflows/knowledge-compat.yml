name: Knowledge Card Compatibility

on:
  schedule:
    # Weekly on Monday 06:00 UTC
    - cron: "0 6 * * 1"
  release:
    types: [published]
  workflow_dispatch:

jobs:
  card-compat:
    name: "Card compat — ${{ matrix.card }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core library cards shipped with aihydro-tools
          - card: pynhd
            install: "pynhd>=0.16.0"
            smoke: |
              from pynhd import NLDI
              nldi = NLDI()
              print("pynhd NLDI instantiation: OK")
          - card: py3dep
            install: "py3dep"
            smoke: |
              import py3dep
              print("py3dep import: OK")
          - card: pygeohydro
            install: "pygeohydro"
            smoke: |
              import pygeohydro
              print("pygeohydro import: OK")
          - card: pygridmet
            install: "pygridmet"
            smoke: |
              import pygridmet
              print("pygridmet import: OK")
          - card: hydrofunctions
            install: "hydrofunctions"
            smoke: |
              import hydrofunctions as hf
              print("hydrofunctions import: OK")
          - card: pysheds
            install: "pysheds"
            smoke: |
              from pysheds.grid import Grid
              print("pysheds Grid import: OK")
          - card: rasterio
            install: "rasterio"
            smoke: |
              import rasterio
              print("rasterio version:", rasterio.__version__)
          - card: xarray
            install: "xarray"
            smoke: |
              import xarray as xr
              ds = xr.Dataset()
              print("xarray Dataset: OK")
          # P1 cards added in 1.7.0
          - card: torch
            install: "torch>=1.13.0"
            smoke: |
              import torch
              x = torch.tensor([1.0, 2.0, 3.0])
              print("torch tensor:", x.mean().item())
          - card: geopandas
            install: "geopandas>=0.12.0"
            smoke: |
              import geopandas as gpd
              from shapely.geometry import Point
              gdf = gpd.GeoDataFrame({"id": [1]}, geometry=[Point(0, 0)], crs="EPSG:4326")
              area = gdf.to_crs("EPSG:5070").geometry.area.iloc[0]
              print("geopandas area (m2):", area)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install aihydro-tools (no extras) + card library
        run: |
          pip install -e ".[dev]" --no-deps
          pip install ${{ matrix.install }}

      - name: Run card smoke test
        run: |
          python - <<'PYEOF'
          ${{ matrix.smoke }}
          PYEOF

      - name: Verify card JSON is loadable
        run: |
          python - <<'PYEOF'
          import json
          from pathlib import Path

          card_name = "${{ matrix.card }}"
          cards_dir = Path("ai_hydro/knowledge/library_refs")
          card_path = cards_dir / f"{card_name}.json"
          if not card_path.exists():
              # Check plugin dirs via entry points
              from importlib.metadata import entry_points
              found = False
              for ep in entry_points(group="aihydro.knowledge"):
                  plugin_dir = ep.load()()
                  plugin_path = Path(plugin_dir) / "library_refs" / f"{card_name}.json"
                  if plugin_path.exists():
                      card_path = plugin_path
                      found = True
                      break
              if not found:
                  raise FileNotFoundError(f"Card not found: {card_name}.json")

          card = json.loads(card_path.read_text())
          assert "library" in card, "Card missing 'library' field"
          assert "gotchas" in card, "Card missing 'gotchas' field"
          assert "common_patterns" in card, "Card missing 'common_patterns' field"
          assert "version_compatible" in card, "Card missing 'version_compatible' field (B2 Tier 1)"
          print(f"Card {card_name!r}: {len(card['gotchas'])} gotchas, version_compatible={card['version_compatible']!r}")
          PYEOF
